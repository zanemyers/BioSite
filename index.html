<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- SVG is preferred where supported; .ico covers legacy browsers. Both are the ZM monogram. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Zane Myers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Zane Myers — Software Developer. Full-stack developer building web applications with Python, Django, React, and Node.js." />
  <meta name="author" content="Zane Myers" />
  <meta name="robots" content="index, follow">
  <!-- Kept in sync with --background by the bootstrap script below and by ThemeToggle. -->
  <meta name="theme-color" content="#fafbfd" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  />
  <script>
    (() => {
      try {
        const stored = localStorage.getItem('theme');
        const isDark = stored === 'dark' || (!stored && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#070a13');
        }
      } catch {}
    })();
  </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
